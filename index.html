<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Code AI - مساعد البرمجة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo">⌘</span><span>Code AI</span></div>
    <div class="actions">
      <button id="newBtn" class="ghost">مشروع جديد</button>
      <button id="downloadBtn" class="primary">تنزيل ZIP</button>
    </div>
  </header>

  <main class="app">
    <aside class="sidebar">
      <div class="side-title">المشروع</div>
      <div id="fileTree" class="file-tree"></div>
      <div class="side-note">نسخة تعمل مباشرة في المتصفح.<br>يمكن ربطها لاحقًا بمزود ذكاء اصطناعي حقيقي عبر خادم آمن.</div>
    </aside>

    <section class="workspace">
      <div class="hero">
        <div class="badge">AI CODING ASSISTANT</div>
        <h1>اكتب فكرتك، وابنِ مشروعك.</h1>
        <p>اطلب إنشاء موقع أو تطبيق، وسأقترح لك الملفات والكود والمعاينة.</p>
      </div>

      <div class="chat" id="chat"></div>

      <div class="prompt-box">
        <div class="quick">
          <button data-prompt="اصنع لي موقع مشاركة موقع لعدة أشخاص">📍 مشاركة موقع لعدة أشخاص</button>
          <button data-prompt="اصنع لي صفحة تسجيل دخول احترافية">🔐 تسجيل دخول</button>
          <button data-prompt="اصنع لي لعبة بسيطة بالـ JavaScript">🎮 لعبة JavaScript</button>
        </div>
        <textarea id="prompt" placeholder="مثال: اصنع لي موقع مشاركة موقع لعدة أشخاص..."></textarea>
        <div class="prompt-bottom">
          <select id="language">
            <option value="auto">تلقائي</option>
            <option value="html">HTML / CSS / JS</option>
            <option value="python">Python</option>
            <option value="javascript">JavaScript</option>
          </select>
          <button id="sendBtn" class="send">إنشاء ✨</button>
        </div>
      </div>
    </section>

    <section class="editor-panel">
      <div class="panel-head">
        <span id="currentFile">index.html</span>
        <div>
          <button id="copyBtn" class="ghost small">نسخ</button>
          <button id="previewBtn" class="ghost small">معاينة</button>
        </div>
      </div>
      <textarea id="editor" spellcheck="false"></textarea>
      <iframe id="preview" title="preview"></iframe>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
